@let d = node().data;
<label class="flex flex-col gap-1">
  <span class="font-medium">Description</span>
  <textarea
    #description
    rows="3"
    class="rounded-lg border border-neutral-300 bg-white px-2 py-1 font-mono text-sm focus:border-neutral-500 focus:outline-none"
    [value]="d.description ?? ''"
    (input)="updateDescription(description.value)"
  ></textarea>
</label>
