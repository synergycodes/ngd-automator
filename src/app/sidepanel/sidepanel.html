<section
  class="flex flex-col rounded-2xl bg-(--ngd-diagram-background-color) border border-neutral-200 overflow-hidden h-full p-4 gap-4"
>
  <h2 class="text-xl font-medium">Properties</h2>
  @if (nodeData(); as data) {
    <label class="flex flex-col gap-1">
      <span class="font-medium">Label</span>
      <input
        type="text"
        class="rounded-lg border border-neutral-200 bg-white px-2 py-1 font-mono"
        [value]="data.label ?? ''"
        (input)="onLabelChange($any($event.target).value)"
      />
    </label>
  } @else {
    <p>Nothing selected</p>
  }
</section>
