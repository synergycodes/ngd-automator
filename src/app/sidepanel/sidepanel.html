<section
  class="flex flex-col rounded-2xl bg-(--ngd-diagram-background-color) border border-neutral-200 overflow-hidden h-full p-4 gap-4"
>
  <h2 class="text-xl font-medium">Properties</h2>

  @let node = selectedNode();
  @if (node) {
    @switch (node.type) {
      @case ('trigger') {
        <app-trigger-node-panel [node]="node" />
      }
      @case ('action') {
        <app-action-node-panel [node]="node" />
      }
      @case ('decision') {
        <app-decision-node-panel [node]="node" />
      }
      @case ('result') {
        <app-result-node-panel [node]="node" />
      }
    }
  } @else {
    <p class="text-neutral-500">Nothing selected</p>
  }
</section>
